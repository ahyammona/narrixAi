[package]
name = "pumpfun_new_mint"
version = "0.1.0"
edition = "2021"



[dependencies]
solana-client = "1.18"
solana-sdk = "1.18"
solana-transaction-status = "1.18"
spl-associated-token-account = "2.0"
futures-util = "0.3"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bs58 = "0.5"
dotenv = "0.15"
borsh = "0.10"
zeroize = "=1.3.0"
base64 = "=0.22.1"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.11", features = ["json"] }
solana-program = "1.18"

# X (Twitter) scraping, vendored
xplore = { path = "vendor/xplore" }
tracing = { version = "0.1", features = ["log"] }

[[example]]
name = "create_token"
path = "examples/create_token.rs"
